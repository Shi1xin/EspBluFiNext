name: EspBlufiNext

options:
  bundleIdPrefix: com.cyberbacchus
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig

packages:
  BluFiKit:
    path: Packages/BluFiKit

targets:
  EspBlufiNext:
    type: application
    platform: iOS
    sources:
      - path: Sources/EspBlufiNext
    resources:
      - path: Sources/EspBlufiNext/Resources
    info:
      path: Sources/EspBlufiNext/Info.plist
      properties:
        NSBluetoothAlwaysUsageDescription: "EspBluFi uses Bluetooth to discover and communicate with ESP BluFi devices."
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.espblufi.next
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: false
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: true
        INFOPLIST_KEY_UILaunchScreen_Generation: true
    dependencies:
      - package: BluFiKit
        product: BluFiKit

  EspBlufiNextTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/EspBlufiNextTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.espblufi.next.tests
        SWIFT_VERSION: "6.0"
    dependencies:
      - target: EspBlufiNext
      - package: BluFiKit
        product: BluFiKit

schemes:
  EspBlufiNext:
    build:
      targets:
        EspBlufiNext: all
        EspBlufiNextTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - EspBlufiNextTests
